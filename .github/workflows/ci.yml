name: Cortex AI CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Build and Test Frontend
  test-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  # 2. Test Backend Microservices
  test-backend:
    name: Verify Backend Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ gateway, services/auth, services/chat, services/agent, services/billing ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies for ${{ matrix.service }}
        working-directory: ./backend/${{ matrix.service }}
        run: npm install --omit=dev

      - name: Validate Syntax for ${{ matrix.service }}
        working-directory: ./backend/${{ matrix.service }}
        run: node -c index.js

  # 3. Validate Docker Compose Configuration
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

