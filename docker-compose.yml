version: '3.8'

services:
  # Shared In-Memory Cache & Session Store
  redis:
    image: redis:alpine
    container_name: cortex-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - cortex-network

  # Gateway (Reverse Proxy & Session Resolution)
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: cortex-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth:8001
      - CHAT_SERVICE_URL=http://chat:8002
      - AGENT_SERVICE_URL=http://agent:8003
      - BILLING_SERVICE_URL=http://billing:8004
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - redis
      - auth
      - chat
      - agent
      - billing
    networks:
      - cortex-network

  # Auth Service
  auth:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: cortex-auth
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cortex-network

  # Chat Service
  chat:
    build:
      context: ./backend/services/chat
      dockerfile: Dockerfile
    container_name: cortex-chat
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cortex-network

  # Agent Service (LangGraph Orchestration)
  agent:
    build:
      context: ./backend/services/agent
      dockerfile: Dockerfile
    container_name: cortex-agent
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - BILLING_SERVICE_URL=http://billing:8004
    networks:
      - cortex-network

  # Billing Service
  billing:
    build:
      context: ./backend/services/billing
      dockerfile: Dockerfile
    container_name: cortex-billing
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - MONGODB_URI=${MONGODB_URI}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    networks:
      - cortex-network

networks:
  cortex-network:
    driver: bridge
