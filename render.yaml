services:
  - type: web
    name: cortex-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://cortex-ai-roan.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
